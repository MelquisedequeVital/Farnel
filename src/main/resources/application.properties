spring.application.name=farnel

spring.datasource.url=jdbc:postgresql://localhost:5432/farnel
spring.datasource.username=postgres
spring.datasource.password=ifpb

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Executa o data.sql em toda inicialização, depois que o Hibernate cria/atualiza as tabelas
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
