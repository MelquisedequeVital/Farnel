spring.application.name=farnel

spring.datasource.url=jdbc:postgresql://localhost:5432/farnel
spring.datasource.username=postgres
spring.datasource.password=ifpb

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Executa o data.sql em toda inicialização, depois que o Hibernate cria/atualiza as tabelas
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# Sessão (carrinho) só por cookie, sem ;jsessionid= nas URLs
server.servlet.session.tracking-modes=cookie

# Upload da foto do prato (painel do parceiro)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
