<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- Fragments do painel da empresa contratante (módulo B2B): barra lateral e barra superior -->

<body>

	<aside th:fragment="sidebar(ativo)" class="fixed left-0 top-0 h-full w-72 bg-surface-container-low border-r border-surface-container-highest z-50 flex flex-col justify-between py-8 px-6">
		<div class="space-y-10">
			<div>
				<a th:href="@{/empresa}" class="block">
					<span class="font-headline-lg text-headline-lg text-primary tracking-tight font-normal">Farnel</span>
				</a>
				<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary block mt-1">Módulo B2B • Corporativo</span>
			</div>
			<nav class="flex flex-col space-y-1">
				<a th:href="@{/empresa/contrato}"
					th:classappend="${ativo == 'contrato'} ? 'bg-surface-container text-primary font-semibold border-l-2 border-primary' : 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high'"
					class="flex items-center px-3 py-3 transition-colors font-label-lg text-label-lg uppercase tracking-wider">
					<span class="material-symbols-outlined text-[24px] mr-3.5">contract</span>Contrato
				</a>
				<a th:href="@{/catalogo}"
					class="flex items-center px-3 py-3 text-outline hover:text-on-surface transition-colors font-label-lg text-label-lg uppercase tracking-wider mt-6 pt-6 border-t border-surface-container-highest">
					<span class="material-symbols-outlined text-[24px] mr-3.5">arrow_back</span>Ver Catálogo
				</a>
			</nav>
		</div>
		<div class="border-t border-surface-container-highest pt-6 space-y-4">
			<div class="flex items-center">
				<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center mr-3.5">
					<span class="material-symbols-outlined text-on-primary text-[20px]">apartment</span>
				</div>
				<div class="min-w-0">
					<span th:text="${usuarioLogado != null} ? ${usuarioLogado.nome} : 'Gestor B2B'" class="block font-label-md text-label-md uppercase font-semibold text-on-surface truncate">Gestor</span>
					<span class="block font-label-sm text-label-sm text-outline">Gestor da empresa</span>
				</div>
			</div>
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="flex items-center gap-2 font-label-sm text-label-sm uppercase tracking-wider text-outline hover:text-error transition-colors">
					<span class="material-symbols-outlined text-[18px]">logout</span>Sair
				</button>
			</form>
		</div>
	</aside>

	<header th:fragment="topbar(trilha)" class="fixed top-0 left-72 right-0 h-20 z-40 bg-surface/90 backdrop-blur-md border-b border-surface-container-highest flex items-center px-12">
		<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary font-semibold">Módulo B2B</span>
		<span class="mx-3 text-outline-variant">/</span>
		<span th:text="${trilha}" class="font-body-sm text-body-sm text-on-surface">Página</span>
	</header>

</body>
</html>
