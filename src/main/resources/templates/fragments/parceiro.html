<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- Fragments do painel do parceiro (módulo restaurante): barra lateral e barra superior -->

<body>

	<aside th:fragment="sidebar(ativo)" class="fixed left-0 top-0 h-full w-72 bg-surface-container-low border-r border-surface-container-highest z-50 flex flex-col justify-between py-8 px-6">
		<div class="space-y-10">
			<div>
				<a th:href="@{/parceiro}" class="block">
					<span class="font-headline-lg text-headline-lg text-primary tracking-tight font-normal">Farnel</span>
				</a>
				<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary block mt-1">Módulo Restaurante • Cozinha</span>
			</div>
			<nav class="flex flex-col space-y-1">
				<span title="Em breve"
					class="flex items-center px-3 py-3 text-outline/60 font-label-lg text-label-lg uppercase tracking-wider cursor-not-allowed">
					<span class="material-symbols-outlined text-[24px] mr-3.5">skillet</span>Lista de Produção
					<span class="ml-auto font-label-sm text-label-sm normal-case tracking-normal">em breve</span>
				</span>
				<a th:href="@{/parceiro/pratos}"
					th:classappend="${ativo == 'pratos'} ? 'bg-surface-container text-primary font-semibold border-l-2 border-primary' : 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high'"
					class="flex items-center px-3 py-3 transition-colors font-label-lg text-label-lg uppercase tracking-wider">
					<span class="material-symbols-outlined text-[24px] mr-3.5">restaurant_menu</span>Pratos &amp; Alérgenos
				</a>
				<a th:href="@{/catalogo}"
					class="flex items-center px-3 py-3 text-outline hover:text-on-surface transition-colors font-label-lg text-label-lg uppercase tracking-wider mt-6 pt-6 border-t border-surface-container-highest">
					<span class="material-symbols-outlined text-[24px] mr-3.5">arrow_back</span>Ver Catálogo Consumidor
				</a>
			</nav>
		</div>
		<div class="border-t border-surface-container-highest pt-6">
			<div class="flex items-center">
				<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center mr-3.5">
					<span class="material-symbols-outlined text-on-primary text-[20px]">soup_kitchen</span>
				</div>
				<div>
					<span class="block font-label-md text-label-md uppercase font-semibold text-on-surface">Painel do Parceiro</span>
					<span class="block font-label-sm text-label-sm text-outline">Acesso sem login (provisório)</span>
				</div>
			</div>
		</div>
	</aside>

	<header th:fragment="topbar(trilha)" class="fixed top-0 left-72 right-0 h-20 z-40 bg-surface/90 backdrop-blur-md border-b border-surface-container-highest flex items-center px-12">
		<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary font-semibold">Módulo Restaurante</span>
		<span class="mx-3 text-outline-variant">/</span>
		<span th:text="${trilha}" class="font-body-sm text-body-sm text-on-surface">Página</span>
	</header>

</body>
</html>
