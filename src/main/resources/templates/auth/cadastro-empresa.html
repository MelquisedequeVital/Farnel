<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Credenciar Empresa')}"></head>

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col justify-between">

	<header th:replace="~{fragments/layout :: header('cadastro')}"></header>

	<main class="pt-28 pb-16 px-margin flex-grow flex items-center justify-center">
		<div class="w-full max-w-2xl bg-surface-container-lowest p-8 md:p-12 border border-surface-container-highest shadow-sm">
			<div class="mb-8">
				<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary block mb-1">Módulo B2B Corporativo</span>
				<h1 class="font-headline-lg text-headline-lg text-primary">Credencie sua Empresa</h1>
				<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">
					Ofereça marmitas artesanais como benefício de alimentação aos seus colaboradores.
				</p>
			</div>

			<form th:action="@{/cadastro/empresa}" th:object="${form}" method="post" class="space-y-6">
				<div th:if="${#fields.hasGlobalErrors()}" class="bg-error-container text-on-error-container px-4 py-3 font-body-sm text-body-sm">
					<p th:each="e : ${#fields.globalErrors()}" th:text="${e}">Erro</p>
				</div>

				<div class="border-b border-surface-container-highest pb-6">
					<h2 class="font-headline-sm text-headline-sm text-primary mb-4">1. Dados da Empresa</h2>
					<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
						<div class="md:col-span-2">
							<label for="razaoSocial" class="block font-label-md text-label-md uppercase tracking-wider text-on-surface mb-1">Razão Social *</label>
							<input type="text" id="razaoSocial" th:field="*{razaoSocial}" required placeholder="Ex.: Tech Nordeste Soluções Ltda."
								class="w-full px-4 py-2.5 bg-surface border border-surface-container-highest focus:border-primary focus:outline-none font-body-sm text-body-sm text-on-surface transition-colors"
								th:classappend="${#fields.hasErrors('razaoSocial')} ? 'border-error' : ''">
							<span th:if="${#fields.hasErrors('razaoSocial')}" th:errors="*{razaoSocial}" class="text-error text-xs block mt-1"></span>
						</div>
						<div>
							<label for="cnpj" class="block font-label-md text-label-md uppercase tracking-wider text-on-surface mb-1">CNPJ *</label>
							<input type="text" id="cnpj" th:field="*{cnpj}" required placeholder="00.000.000/0000-00"
								class="w-full px-4 py-2.5 bg-surface border border-surface-container-highest focus:border-primary focus:outline-none font-body-sm text-body-sm text-on-surface transition-colors"
								th:classappend="${#fields.hasErrors('cnpj')} ? 'border-error' : ''">
							<span th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}" class="text-error text-xs block mt-1"></span>
						</div>
						<div>
							<label for="telefone" class="block font-label-md text-label-md uppercase tracking-wider text-on-surface mb-1">Telefone *</label>
							<input type="tel" id="telefone" th:field="*{telefone}" required placeholder="(83) 3333-0000"
								class="w-full px-4 py-2.5 bg-surface border border-surface-container-highest focus:border-primary focus:outline-none font-body-sm text-body-sm text-on-surface transition-colors"
								th:classappend="${#fields.hasErrors('telefone')} ? 'border-error' : ''">
							<span th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="text-error text-xs block mt-1"></span>
						</div>
						<div class="md:col-span-2">
							<label for="enderecoEntrega" class="block font-label-md text-label-md uppercase tracking-wider text-on-surface mb-1">Endereço Corporativo de Entrega *</label>
							<textarea id="enderecoEntrega" th:field="*{enderecoEntrega}" rows="2" required placeholder="Ex.: Av. Epitácio Pessoa, 2500, 5º andar - Tambauzinho, João Pessoa/PB"
								class="w-full px-4 py-2.5 bg-surface border border-surface-container-highest focus:border-primary focus:outline-none font-body-sm text-body-sm text-on-surface transition-colors"
								th:classappend="${#fields.hasErrors('enderecoEntrega')} ? 'border-error' : ''"></textarea>
							<span th:if="${#fields.hasErrors('enderecoEntrega')}" th:errors="*{enderecoEntrega}" class="text-error text-xs block mt-1"></span>
						</div>
					</div>
				</div>

				<div class="border-b border-surface-container-highest pb-6">
					<h2 class="font-headline-sm text-headline-sm text-primary mb-4">2. Gestor Responsável &amp; Acesso</h2>
					<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
						<div class="md:col-span-2">
							<label for="responsavel" class="block font-label-md text-label-md uppercase tracking-wider text-on-surface mb-1">Nome do Gestor *</label>
							<input type="text" id="responsavel" th:field="*{responsavel}" required placeholder="Ex.: Mariana Costa"
								class="w-full px-4 py-2.5 bg-surface border border-surface-container-highest focus:border-primary focus:outline-none font-body-sm text-body-sm text-on-surface transition-colors"
								th:classappend="${#fields.hasErrors('responsavel')} ? 'border-error' : ''">
							<span th:if="${#fields.hasErrors('responsavel')}" th:errors="*{responsavel}" class="text-error text-xs block mt-1"></span>
						</div>
						<div>
							<label for="email" class="block font-label-md text-label-md uppercase tracking-wider text-on-surface mb-1">E-mail de Acesso *</label>
							<input type="email" id="email" th:field="*{email}" required placeholder="rh@empresa.com.br"
								class="w-full px-4 py-2.5 bg-surface border border-surface-container-highest focus:border-primary focus:outline-none font-body-sm text-body-sm text-on-surface transition-colors"
								th:classappend="${#fields.hasErrors('email')} ? 'border-error' : ''">
							<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-error text-xs block mt-1"></span>
						</div>
						<div>
							<label for="senha" class="block font-label-md text-label-md uppercase tracking-wider text-on-surface mb-1">Senha * (mín. 6 dígitos)</label>
							<input type="password" id="senha" th:field="*{senha}" required placeholder="••••••••"
								class="w-full px-4 py-2.5 bg-surface border border-surface-container-highest focus:border-primary focus:outline-none font-body-sm text-body-sm text-on-surface transition-colors"
								th:classappend="${#fields.hasErrors('senha')} ? 'border-error' : ''">
							<span th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="text-error text-xs block mt-1"></span>
						</div>
					</div>
				</div>

				<button type="submit"
					class="w-full py-3.5 bg-primary text-on-primary font-label-lg text-label-lg uppercase tracking-wider hover:bg-primary-container transition-colors shadow-sm">
					Credenciar Empresa
				</button>
			</form>

			<div class="mt-8 pt-6 border-t border-surface-container-highest text-center">
				<p class="font-body-sm text-body-sm text-on-surface-variant">
					Já possui cadastro?
					<a th:href="@{/login}" class="font-label-lg text-label-lg uppercase tracking-wider text-secondary hover:underline ml-1">Fazer Login</a>
				</p>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
